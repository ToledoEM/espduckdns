[project]
site_name = "ESP32 DuckDNS"
site_description = "Standalone Dynamic DNS client for DuckDNS.org on an ESP32"
site_url = "https://toledoem.github.io/espduckdns/"
docs_dir = "docs"
site_dir = "site"
copyright = 'Docs made with <a href="https://zensical.org">Zensical</a> · Developed by <a href="https://github.com/ToledoEM">ToledoEM</a> · MIT License'
repo_url = "https://github.com/ToledoEM/espduckdns"
repo_name = "ToledoEM/espduckdns"

extra_css = ["stylesheets/extra.css"]
exclude_docs = "overrides/"

nav = [
  { "Home" = "index.md" },
]

[project.extra]
generator = false

[project.theme]
language = "en"
custom_dir = "docs/overrides"
logo = "images/ducky_icon.png"
favicon = "images/favicon.ico"
icon.repo = "fontawesome/brands/github"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.top",
  "search.highlight",
  "toc.integrate",
]

# Light theme only: one palette, no toggle.
[[project.theme.palette]]
scheme = "default"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
